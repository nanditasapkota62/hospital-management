services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: hospital_root_pw
      MYSQL_DATABASE: hospital_db
    volumes:
      - dbdata:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -phospital_root_pw"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - hospital-net

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: hospital_root_pw
      DB_NAME: hospital_db
      DB_PORT: 3306
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hospital-net

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - hospital-net

networks:
  hospital-net:

volumes:
  dbdata:
  uploads: